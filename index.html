<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioquímica — Módulos interactivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1f1c;
      --foam: #f3faf7;
      --mist: rgba(243, 250, 247, 0.88);
      --teal: #0f766e;
      --teal-deep: #134e4a;
      --accent: #2dd4bf;
      --line: rgba(243, 250, 247, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Sora", sans-serif;
      color: var(--foam);
      background: var(--ink);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      isolation: isolate;
    }

    .hero__media {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        url("https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=2000&q=80")
        center / cover no-repeat;
      transform: scale(1.06);
      animation: drift 28s ease-in-out infinite alternate;
    }

    .hero__veil {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(12, 31, 28, 0.35) 0%, rgba(12, 31, 28, 0.55) 42%, rgba(12, 31, 28, 0.92) 100%),
        radial-gradient(ellipse at 20% 10%, rgba(45, 212, 191, 0.22), transparent 55%);
    }

    .hero__content {
      width: min(920px, calc(100% - 2.5rem));
      margin: 0 auto 4.5rem;
      padding-top: 5rem;
      animation: rise 0.9s ease-out both;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-size: clamp(3.2rem, 10vw, 5.6rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .brand span {
      color: var(--accent);
    }

    .lede {
      font-family: "Fraunces", serif;
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      font-weight: 500;
      line-height: 1.25;
      max-width: 18ch;
      margin-bottom: 0.75rem;
    }

    .support {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.55;
      color: rgba(243, 250, 247, 0.78);
      max-width: 36ch;
      margin-bottom: 2rem;
    }

    .modules {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      list-style: none;
    }

    .modules a {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.15rem;
      color: var(--foam);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      border: 1px solid var(--line);
      background: rgba(19, 78, 74, 0.35);
      backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .modules a:hover,
    .modules a:focus-visible {
      background: rgba(15, 118, 110, 0.75);
      border-color: rgba(45, 212, 191, 0.65);
      transform: translateY(-2px);
      outline: none;
    }

    .modules a::after {
      content: "→";
      color: var(--accent);
      transition: transform 0.25s ease;
    }

    .modules a:hover::after,
    .modules a:focus-visible::after {
      transform: translateX(3px);
    }

    .modules li {
      animation: rise 0.8s ease-out both;
    }

    .modules li:nth-child(1) { animation-delay: 0.15s; }
    .modules li:nth-child(2) { animation-delay: 0.25s; }
    .modules li:nth-child(3) { animation-delay: 0.35s; }
    .modules li:nth-child(4) { animation-delay: 0.45s; }

    @keyframes drift {
      from { transform: scale(1.06) translate3d(0, 0, 0); }
      to { transform: scale(1.12) translate3d(-1.5%, -1%, 0); }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__media,
      .hero__content,
      .modules li {
        animation: none;
      }

      .modules a,
      .modules a::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="hero__veil" aria-hidden="true"></div>

    <div class="hero__content">
      <p class="brand">Bioquímica<span>.</span></p>
      <h1 class="lede">Módulos interactivos para medicina</h1>
      <p class="support">Elegí un tema y practicá metabolismo, cálculos clínicos y preguntas de alto rendimiento.</p>

      <ul class="modules">
        <li><a href="colesterol.html">Colesterol</a></li>
        <li><a href="glucidos_lipidos.html">Glúcidos y lípidos</a></li>
        <li><a href="lipidos-glucidos-choices.html">Banco de preguntas</a></li>
        <li><a href="soluciones.html">Soluciones</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
